name: Build NIK-OS
on:
  schedule:
    - cron: '0 10 * * *' # Daily at 10:00 UTC
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build NIK-OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.IMAGE_REGISTRY }}/nik-os
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=stable

      - name: Build NIK-OS Image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          image: nik-os
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true

      - name: Push to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v2
        id: push
        if: github.event_name != 'pull_request'
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        
      - name: Sign the container image
        if: github.event_name != 'pull_request'
        run: |
          cosign login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            ${{ env.IMAGE_REGISTRY }}/nik-os@${{ steps.push.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_EXPERIMENTAL: false

      - name: Echo outputs
        if: github.event_name != 'pull_request'
        run: |
          echo "Image: ${{ steps.build.outputs.image }}"
          echo "Tags: ${{ steps.build.outputs.tags }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
