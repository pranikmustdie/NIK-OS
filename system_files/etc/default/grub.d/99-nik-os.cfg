# system_files/etc/default/grub.d/99-nik-os.cfg
# NIK-OS Fast Boot and Power Optimization

# Reduce boot timeout for faster startup
GRUB_TIMEOUT=1

# Kernel parameters for performance and battery life
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 nowatchdog"

# Additional kernel parameters for optimization
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} \
  mitigations=auto \
  intel_pstate=active \
  i915.enable_fbc=1 \
  i915.enable_psr=2 \
  i915.fastboot=1 \
  nmi_watchdog=0 \
  audit=0 \
  mem_sleep_default=deep \
  pcie_aspm=force \
  pcie_aspm.policy=powersupersave"

# Disable OS prober for faster boot (no dual-boot)
GRUB_DISABLE_OS_PROBER=true

# Enable graphical boot for professional appearance
GRUB_GFXMODE=1920x1080
GRUB_GFXPAYLOAD_LINUX=keep
