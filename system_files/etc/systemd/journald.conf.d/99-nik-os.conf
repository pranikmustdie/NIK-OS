# system_files/etc/systemd/journald.conf.d/99-nik-os.conf
# Journal optimization for reduced I/O

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=1month
MaxFileSec=1week
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=yes
MaxLevelStore=info
MaxLevelSyslog=warning
