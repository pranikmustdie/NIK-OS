# system_files/etc/systemd/sleep.conf.d/99-nik-os.conf
# NIK-OS Deep Sleep Configuration for Maximum Battery Life

[Sleep]
# Prefer deep sleep (S3) over s2idle for better battery life
SuspendMode=deep
SuspendState=mem

# Hibernate configuration
HibernateMode=platform shutdown
HibernateState=disk

# Hybrid sleep (suspend-then-hibernate)
HybridSleepMode=suspend platform shutdown
HybridSleepState=disk

# Auto-hibernate after 2 hours of suspend to save battery
HibernateDelaySec=7200
