# system_files/etc/systemd/logind.conf.d/99-nik-os.conf
# Login manager power settings

[Login]
# Lid switch actions
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Power button
HandlePowerKey=poweroff
HandleSuspendKey=suspend
HandleHibernateKey=hibernate

# Idle actions for battery conservation
IdleAction=suspend
IdleActionSec=15min

# Faster power off
InhibitDelayMaxSec=5

# Remove idle session
KillUserProcesses=no
