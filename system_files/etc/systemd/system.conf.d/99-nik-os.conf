# system_files/etc/systemd/system.conf.d/99-nik-os.conf
# NIK-OS Systemd Optimizations for Fast Boot

[Manager]
# Reduce default timeout values for faster boot
DefaultTimeoutStartSec=15s
DefaultTimeoutStopSec=10s
DefaultDeviceTimeoutSec=10s

# Set timeout for user services
DefaultTimeoutAbortSec=15s

# Reduce journal size and increase efficiency
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=1month
MaxFileSec=1week

# Watchdog disabled for battery (already in kernel params)
RuntimeWatchdogSec=0
ShutdownWatchdogSec=10min

# CPU affinity for better performance
CPUAffinity=0-7

---
